user nginx;
worker_processes auto; # Usually set to number of CPU cores

events {
    worker_connections 1024; # Max simultaneous connections per worker
}

http {
    include /etc/nginx/mime.types; # Tells NGINX how to handle different file types
    default_type application/octet-stream;

    server {
        listen 80; # Port to listen on
        server_name example.com; # Your domain name

        location / {
            root /var/www/html; # Path to your website files
            index index.html;
        }

        # Example Reverse Proxy
        location /api/ {
            proxy_pass http://localhost:3000;
        }
    }
}
