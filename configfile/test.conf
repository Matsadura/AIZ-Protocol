# Global settings
max_body_size 10M; # Max allowed size for client request bodies [cite: 145]

server {
    # Define the interface:port pairs [cite: 144]
    listen 8080;
    server_name myserver.com; # Optional but allowed [cite: 160]

    # Default error pages [cite: 145]
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    # Route for the main website
    location / {
        # List of accepted HTTP methods [cite: 146]
        methods GET POST;
        
        # Directory where files are located [cite: 147]
        root /var/www/html;
        
        # Default file to serve for directories [cite: 148]
        index index.html; 
        
        # Enable/disable directory listing [cite: 148]
        autoindex on;
    }

    # Route for file uploads
    location /uploads {
        methods POST DELETE; # GET, POST, and DELETE are required 
        root /tmp/www/uploads;
        
        # Storage location for uploaded files [cite: 149]
        upload_store /tmp/www/uploads/storage;
    }

    # Route for HTTP redirection [cite: 147]
    location /old-page {
        return 301 /new-page;
    }

    # CGI execution based on file extension [cite: 150]
    location /cgi-bin {
        methods GET POST;
        root /var/www/cgi;
        
        # Support at least one CGI (e.g., Python or PHP) [cite: 158]
        cgi_ext .py /usr/bin/python3;
        cgi_ext .php /usr/bin/php-cgi;
    }
}

# You must be able to listen to multiple ports/websites [cite: 134, 144]
server {
    listen 8080;
    listen 127.0.0.1:9090;
    root /var/www/other;
    index second.html;
}