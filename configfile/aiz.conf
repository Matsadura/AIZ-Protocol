server {
    listen 8080;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        methods GET;
        root www/html;
        index index.html;
        autoindex on;
    }

    location /test-dir-listing {
        root www/library;
        autoindex on;
    }

    location /test-no-root {
        index index.html;
    }

    location /test-listing-index {
        index index.html;
        root www/library;
    }

    location /cgi-bin {
        methods GET POST;
        root www/cgi-bin;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .php /usr/bin/php-cgi;
    }


