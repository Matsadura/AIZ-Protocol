    location /uploads {
        methods GET POST;
        root www/public;
        autoindex on;
        upload_store www/public;
    }

    location /delete {
        methods DELETE;
        root www/public;
    }

    location /styles {
        methods GET;
        root www/styles;
    }

    location /upload-file {
        methods GET;
        root www/html/;
        index upload.html;
    }
