server {
    listen 8080;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        methods GET POST;
        root /tmp/webserv_test/www/html;
        index index.html;
        autoindex on;
    }

    location /indexed_dir {
        methods GET POST;
        root /tmp/webserv_test/www/;
        index index.html;
        autoindex on;
    }

    # autoindex off + no index -> 403 "no index file and listing is off"
    location /noindex {
        methods GET;
        root /tmp/webserv_test/www/noindexdir;
    }

    location /dir_listing_off {
        methods GET;
        root /tmp/webserv_test/www/noindexdir;
        index index.php;
        autoindex off;
    }

    # autoindex on but the directory itself is chmod 000
    # -> 403 "Directory is unreadable for listing"
    location /locked-listing {
        methods GET;
        root /tmp/webserv_test/www/lockeddir;
        autoindex on;
    }

    location /uploads {
        methods POST DELETE;
        root /tmp/webserv_test/www/uploads;
        upload_store /tmp/webserv_test/www/uploads/storage;
    }

    location /old-page {
        return 301 /new-page;
    }

    location /cgi-bin {
        methods GET POST;
        root /tmp/webserv_test/www/cgi;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .php /usr/bin/php-cgi;
    }

    # deliberately no `root` -> 404 "Root directory is not configured"
    location /noroot {
        methods GET;
        autoindex on;
    }

    # quick checks against real files, no fixture_gen.sh needed:
    # /sysfiles/hostname -> 200, /sysfiles/shadow -> 403, /sysfiles/x -> 404
    location /sysfiles {
        methods GET;
        root /etc;
        autoindex off;
    }
}
